/* ===================================
   ANIMATED BACKGROUND
=================================== */

#backgroundCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-20;
  pointer-events:none;
}

.background-glow{
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,106,0,.18),
      transparent 65%
    );

  filter:blur(35px);

  z-index:-10;

  animation:
    glowMove 12s ease-in-out infinite alternate;

  pointer-events:none;
}

.glow-one{
  top:-180px;
  right:-150px;
}

.glow-two{
  bottom:-200px;
  left:-160px;

  background:
    radial-gradient(
      circle,
      rgba(255,190,50,.10),
      transparent 65%
    );

  animation-delay:3s;
}

@keyframes glowMove{

  0%{
    transform:
      translate(0,0)
      scale(1);
  }

  100%{
    transform:
      translate(-100px,80px)
      scale(1.25);
  }

}

/* ===================================
   NAVBAR
=================================== */

.navbar{

  position:fixed;

  top:15px;
  left:4%;
  right:4%;

  z-index:100;

  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:13px 18px;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:22px;

  background:
    rgba(5,7,10,.75);

  backdrop-filter:
    blur(20px);

  box-shadow:
    0 20px 70px
    rgba(0,0,0,.45);

}

.logo{

  font-size:23px;

  font-weight:900;

  letter-spacing:-1px;

}

.logo span{

  color:#ff6a00;

}

.logo small{

  color:#777;

  font-size:9px;

  margin-right:5px;

}

.nav-links{

  display:flex;

  gap:25px;

  color:#a8adb8;

  font-size:14px;

}

.nav-links a{

  transition:.25s;

}

.nav-links a:hover{

  color:#ff6a00;

}

.nav-button{

  background:#ff6a00;

  color:white;

  padding:11px 17px;

  border-radius:13px;

  font-weight:800;

  transition:.25s;

}

.nav-button:hover{

  transform:translateY(-3px);

  box-shadow:
    0 12px 35px
    rgba(255,106,0,.35);

}

/* ===================================
   HERO
=================================== */

.hero{

  min-height:92vh;

  display:flex;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:
    150px 20px
    80px;

  position:relative;

}

.hero-shape{

  position:absolute;

  width:430px;
  height:430px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,106,0,.2);

  box-shadow:
    0 0 100px
    rgba(255,106,0,.08);

  animation:
    heroRotate 18s linear infinite;

}

.hero-shape::before,
.hero-shape::after{

  content:"";

  position:absolute;

  inset:40px;

  border-radius:40%;

  border:
    1px solid
    rgba(255,255,255,.07);

}

.hero-shape::after{

  inset:90px;

  border-color:
    rgba(255,106,0,.15);

}

@keyframes heroRotate{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

.hero-content{

  position:relative;

  z-index:2;

}

.hero-label{

  color:#ff6a00;

  font-weight:800;

  margin-bottom:20px;

  letter-spacing:1px;

}

.hero h1{

      105px
    );

  line-height:1;

  font-weight:900;

  letter-spacing:-5px;

}

.hero h1 span{

  color:#ff6a00;

  text-shadow:

}
